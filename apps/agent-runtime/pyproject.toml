[project]
name = "weflow-agent-runtime"
version = "0.1.0"
description = "WeFlow replay-first agent runtime skeleton"
requires-python = ">=3.12,<3.15"
dependencies = [
  "weflow-contracts",
  "weflow-extension-sdk",
  "weflow-telemetry",
  "weflow-control-kernel",
]

[tool.uv.sources]
weflow-contracts = { workspace = true }
weflow-extension-sdk = { workspace = true }
weflow-control-kernel = { workspace = true }
weflow-telemetry = { workspace = true }

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/weflow_agent_runtime"]
