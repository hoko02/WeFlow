[project]
name = "weflow-platform-api"
version = "0.1.0"
description = "WeFlow platform API skeleton"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.34,<1",
  "weflow-contracts",
  "weflow-telemetry",
  "weflow-control-kernel",
  "weflow-testkit",
]

[tool.uv.sources]
weflow-contracts = { workspace = true }
weflow-control-kernel = { workspace = true }
weflow-telemetry = { workspace = true }
weflow-testkit = { workspace = true }

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weflow_platform_api"]

