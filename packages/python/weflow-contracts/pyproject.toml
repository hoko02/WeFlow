[project]
name = "weflow-contracts"
version = "0.1.0"
description = "Canonical JSON Schema validators for WeFlow"
requires-python = ">=3.12,<3.15"
dependencies = [
  "jsonschema>=4.23,<5",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/weflow_contracts"]
