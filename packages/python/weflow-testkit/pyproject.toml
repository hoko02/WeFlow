[project]
name = "weflow-testkit"
version = "0.1.0"
description = "Deterministic fixture and fault helpers for WeFlow"
requires-python = ">=3.12,<3.15"
dependencies = [
  "weflow-contracts",
]

[tool.uv.sources]
weflow-contracts = { workspace = true }

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/weflow_testkit"]
